name: Hexing Electrical Co., Ltd.
description: >-
  Hexing Electrical Co., Ltd. (海兴电力 / Hexing) is a Chinese energy-technology
  company focused on smart power distribution and utilization, new energy,
  smart water and gas, water treatment and clean water, and marine
  electrification. Beyond hardware, Hexing delivers integrated solutions and
  project delivery spanning metering devices, communication networks (RF, PLC,
  cellular, NB-IoT), MDC / MDM / AMI platforms, billing systems, distribution
  automation, energy storage (BESS), EV charging, water metering, seawater
  desalination and electric marine propulsion. The company reports 34 years of
  industry experience, operations across 110+ countries and 17 global
  manufacturing hubs. Surfaced as a portfolio company of qiming and profiled in
  the API Evangelist network; Hexing publishes no public developer/API surface
  today, so this profile captures corporate identity plus the AI knowledge file
  (llms.txt) the company publishes for AI search / RAG.
